name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/_sphinx/requirements.txt
      - uses: dart-lang/setup-dart@v1
      - name: Install tools
        run: |
          pip install -r doc/_sphinx/requirements.txt
          dart pub global activate dartdoc_json
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Build
        run: sphinx-build -M html doc doc/_build -c doc/_sphinx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
